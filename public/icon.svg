<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" floodColor="#6366f1" floodOpacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Automata Nodes -->
  <!-- Start Arrow -->
  <path d="M 90 256 L 145 256" stroke="#06b6d4" stroke-width="12" stroke-linecap="round"/>
  <polygon points="140 240, 165 256, 140 272" fill="#06b6d4"/>

  <!-- State q0 -->
  <circle cx="210" cy="256" r="54" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="10" filter="url(#glow)"/>
  <text x="210" y="267" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="34">q0</text>

  <!-- Transition Arc -->
  <path d="M 258 230 Q 306 170 354 230" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <polygon points="345 210, 362 238, 332 230" fill="#94a3b8"/>

  <!-- State q1 (Final Double Circle) -->
  <circle cx="400" cy="256" r="54" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="10" filter="url(#glow)"/>
  <circle cx="400" cy="256" r="42" fill="none" stroke="#38bdf8" stroke-width="6"/>
  <text x="400" y="267" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="34">q1</text>
</svg>
